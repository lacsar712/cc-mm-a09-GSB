<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    main { max-width: 760px; margin: 20px auto; padding: 0 12px; }
    input, button { padding: 8px; margin-right: 8px; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    .critical { color: #fff; background: #b91c1c; font-weight: bold; padding: 2px 8px; border-radius: 4px; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    .nav { margin-left: auto; }
    .nav button.active { outline: 2px solid #fca5a5; }
    #criticalView h2 { color: #f87171; }
    .line-setup { background: #292524; padding: 10px; margin-bottom: 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <span id="who"></span>
    <span class="nav">
      <button id="navBoard">班测列表</button>
      <button id="navCritical">危急专板</button>
    </span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 报警，达到危急线为危急。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报；viewer / view123456 只能看</p>
    </section>

    <section id="app" hidden>
      <section id="boardView">
        <p id="live">等待推送</p>
        <form id="form">
          <input id="site" placeholder="测点" />
          <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
          <button>上报</button>
        </form>
        <table><thead><tr><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th></tr></thead><tbody id="rows"></tbody></table>
      </section>

      <section id="criticalView" hidden>
        <div class="line-setup">
          <label>危急线（%，须高于 1%）：
            <input id="criticalInput" type="number" step="0.01" min="1.01" />
          </label>
          <button id="saveCritical">保存危急线</button>
          <span id="criticalMsg"></span>
          <p id="criticalHint" hidden>旁观账号只能查看，不能修改危急线。</p>
        </div>
        <h2>危急记录</h2>
        <table><thead><tr><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th></tr></thead><tbody id="criticalRows"></tbody></table>
      </section>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>

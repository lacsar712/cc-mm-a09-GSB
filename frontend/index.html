<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    main { max-width: 760px; margin: 20px auto; padding: 0 12px; }
    input, button { padding: 8px; margin-right: 8px; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; } .critical { color: #fef08a; font-weight: bold; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    nav button.active { background: #a16207; color: #fff; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <nav>
      <button id="nav-board" class="active">班测台</button>
      <button id="nav-critical">危急专板</button>
    </nav>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 报警线会立刻推到已打开的页面；达到危急线进入危急专板。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报并设置危急线；viewer / view123456 只能看（含危急专板）</p>
    </section>
    <section id="app" hidden>
      <p id="live">等待推送</p>
      <div id="view-board">
        <form id="form">
          <input id="site" placeholder="测点" />
          <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
          <button>上报</button>
        </form>
        <table><thead><tr><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th></tr></thead><tbody id="rows"></tbody></table>
      </div>
      <div id="view-critical" hidden>
        <p>报警线：1%；危急线：<span id="line-value"></span>%</p>
        <form id="line-form">
          <input id="line-input" type="number" step="0.01" min="1.01" placeholder="危急线 %" />
          <button>保存危急线</button>
          <span id="line-msg"></span>
        </form>
        <p id="critical-empty" hidden>暂无危急记录</p>
        <table><thead><tr><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th></tr></thead><tbody id="critical-rows"></tbody></table>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
